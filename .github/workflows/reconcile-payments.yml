# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/reconcile-payments.yml
#
# Ten-minute pinger for the payment reconciliation sweeper.
#
# Why this exists: /api/cron/reconcile-payments settles any Cashfree order
# that was paid but never confirmed, because the student closed the tab and
# the webhook was missed. Until it runs, the student has paid and received
# nothing. Vercel's Hobby plan only permits daily cron expressions, so this
# workflow is the primary trigger and the apps/student-web/vercel.json entry is the fallback.
#
# Required repository secrets:
#   APP_URL      — the STUDENT-WEB deployment origin, e.g. https://language-metrics-student-web.vercel.app
#                  (cron runs on student-web only; teacher-web answers 410)
#   CRON_SECRET  — must match the CRON_SECRET environment variable on the deployment
#
# Until both are set the job skips with a notice rather than failing, so an
# unconfigured repo does not produce a red run every ten minutes.
# ─────────────────────────────────────────────────────────────────────────────

name: Reconcile payments

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs on a best-effort basis and
    # can delay them by several minutes under load, so treat this as "at least
    # every 10 minutes, usually", not a hard guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Nothing here reads or writes the repository.
permissions: {}

# A delayed run must never overlap the next one; settlement is idempotent but
# concurrent sweeps waste database connections and Cashfree API quota.
concurrency:
  group: reconcile-payments
  cancel-in-progress: false

jobs:
  reconcile:
    name: Ping reconcile endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        id: guard
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -z "$APP_URL" ] && missing="APP_URL"
          [ -z "$CRON_SECRET" ] && missing="${missing:+$missing and }CRON_SECRET"

          if [ -n "$missing" ]; then
            echo "::notice title=Reconciliation skipped::$missing not set. Add the repository secret(s) to enable the 10-minute payment sweeper."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call reconcile endpoint
        if: steps.guard.outputs.configured == 'true'
        env:
          # Passed as environment variables rather than interpolated into the
          # command line, so the secret never appears in a rendered step.
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # --fail turns any non-2xx into a non-zero exit, so a 401 from a
          # mismatched secret or a 500 from an unconfigured deployment shows up
          # as a failed run instead of passing silently.
          http_code=$(
            curl --fail --silent --show-error \
                 --connect-timeout 10 --max-time 120 \
                 --retry 2 --retry-delay 10 --retry-connrefused \
                 --request GET \
                 --header "Authorization: Bearer ${CRON_SECRET}" \
                 --output response.json \
                 --write-out '%{http_code}' \
                 "${APP_URL%/}/api/cron/reconcile-payments"
          )

          echo "HTTP $http_code"
          # The response is a summary (counts and order ids only).
          echo "--- response ---"
          cat response.json
          echo

      - name: Summarise
        if: always() && steps.guard.outputs.configured == 'true'
        run: |
          if [ -f response.json ]; then
            {
              echo "### Payment reconciliation result"
              echo ""
              echo '```json'
              cat response.json
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
