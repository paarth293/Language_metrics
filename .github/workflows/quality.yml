name: Workspace quality

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run check:structure
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # #16: fail on high/critical advisories in the web apps' production
      # dependencies. student-mobile's Expo tree is reported, not blocking,
      # until the Expo upgrade (follow-up).
      - run: npm run audit:web
